<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0a5fd6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="22" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- fundo arredondado estilo macOS -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <!-- escudo -->
  <g filter="url(#shadow)">
    <path d="M512 176 L774 268 C774 268 790 560 512 838 C234 560 250 268 250 268 Z" fill="url(#shield)"/>
    <path d="M512 176 L774 268 C774 268 790 560 512 838 C234 560 250 268 250 268 Z" fill="url(#gloss)"/>
  </g>
  <!-- traços de "metadados" riscados -->
  <g stroke="#ffffff" stroke-width="30" stroke-linecap="round" opacity="0.92">
    <line x1="392" y1="392" x2="632" y2="392"/>
    <line x1="392" y1="484" x2="580" y2="484"/>
    <line x1="392" y1="576" x2="540" y2="576"/>
  </g>
  <!-- risco diagonal (remoção) -->
  <line x1="370" y1="640" x2="660" y2="350" stroke="#ff453a" stroke-width="44" stroke-linecap="round"/>
  <line x1="370" y1="640" x2="660" y2="350" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
</svg>
